<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 背景：目に優しいクリーム色、角丸スクエア -->
  <rect width="100" height="100" rx="22" fill="#f5efe6" />

  <!-- ノート白紙 (y=24〜94) -->
  <rect x="18" y="24" width="64" height="70" rx="3.5" fill="#ffffff" stroke="#3d3731" stroke-width="2.6" />

  <!-- 決定版スパイラルリング（5連） -->
  <g stroke="#3d3731" stroke-width="2.6" stroke-linecap="round">
    <path d="M 26.0 29.2 A 5.5 5.5 0 0 1 22.5 24 A 5.5 5.5 0 0 1 32.7 21.2" />
    <path d="M 37.0 29.2 A 5.5 5.5 0 0 1 33.5 24 A 5.5 5.5 0 0 1 43.7 21.2" />
    <path d="M 48.0 29.2 A 5.5 5.5 0 0 1 44.5 24 A 5.5 5.5 0 0 1 54.7 21.2" />
    <path d="M 59.0 29.2 A 5.5 5.5 0 0 1 55.5 24 A 5.5 5.5 0 0 1 65.7 21.2" />
    <path d="M 70.0 29.2 A 5.5 5.5 0 0 1 66.5 24 A 5.5 5.5 0 0 1 77.5 24" />
  </g>

  <!-- 放射光線（12本） -->
  <g stroke="#9c8e7e" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="36" x2="50" y2="40" />
    <line x1="61" y1="39" x2="59" y2="42" />
    <line x1="69" y1="46" x2="66" y2="49" />
    <line x1="72" y1="57" x2="68" y2="57" />
    <line x1="69" y1="68" x2="66" y2="65" />
    <line x1="61" y1="75" x2="59" y2="72" />
    <line x1="39" y1="75" x2="41" y2="72" />
    <line x1="31" y1="68" x2="34" y2="65" />
    <line x1="28" y1="57" x2="32" y2="57" />
    <line x1="31" y1="46" x2="34" y2="49" />
    <line x1="39" y1="39" x2="41" y2="42" />
  </g>

  <!-- 電球ガラス -->
  <circle cx="50" cy="57" r="15" fill="#fffcf5" stroke="#3d3731" stroke-width="2.5" />
  
  <!-- 電球ソケット -->
  <path d="M 43 70 L 57 70 L 55 78 L 45 78 Z" fill="#3d3731" />
  <line x1="46" y1="81" x2="54" y2="81" stroke="#3d3731" stroke-width="2" stroke-linecap="round" />

  <!-- 稲妻フィラメント（①すっきり細め 0.9px） -->
